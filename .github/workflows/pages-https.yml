name: Pages custom domain HTTPS

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-https
  cancel-in-progress: false

jobs:
  configure:
    name: Enable Pages, custom domain, HTTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages and set silvasfusspflege.de
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          DOMAIN="silvasfusspflege.de"

          echo "Using token source: $([[ -n "${{ secrets.PAGES_ADMIN_TOKEN }}" ]] && echo PAGES_ADMIN_TOKEN || echo GITHUB_TOKEN)"

          create_pages() {
            local branch="$1"
            local path="$2"
            gh api --method POST "repos/${REPO}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type='legacy' \
              -f "source[branch]=${branch}" \
              -f "source[path]=${path}"
          }

          echo "Current Pages state (if any):"
          if gh api "repos/${REPO}/pages"; then
            echo "Pages site already exists."
          else
            echo "Pages site missing; creating from master /docs."
            if ! create_pages master /docs; then
              echo "master /docs failed; trying gh-pages /"
              create_pages gh-pages / || true
            fi
          fi

          echo "Setting custom domain ${DOMAIN}."
          if ! gh api --method PUT "repos/${REPO}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f cname="${DOMAIN}" \
            -F https_enforced=false \
            -f build_type='legacy' \
            -f 'source[branch]=master' \
            -f 'source[path]=/docs'; then
            gh api --method PUT "repos/${REPO}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f cname="${DOMAIN}" \
              -F https_enforced=false
          fi

          echo "Triggering DNS health check."
          gh api "repos/${REPO}/pages/health" || true
          echo "Pages config after update:"
          gh api "repos/${REPO}/pages"

      - name: Configure Pages metadata
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait for custom-domain certificate and enforce HTTPS
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          DOMAIN="silvasfusspflege.de"

          for i in $(seq 1 30); do
            page_json="$(gh api "repos/${REPO}/pages")"
            echo "${page_json}"
            state="$(jq -r '.https_certificate.state // "missing"' <<<"${page_json}")"
            echo "Certificate state: ${state} (attempt ${i})"

            if [[ "${state}" == "approved" || "${state}" == "uploaded" || "${state}" == "issued" ]]; then
              gh api --method PUT "repos/${REPO}/pages" \
                -H "Accept: application/vnd.github+json" \
                -f cname="${DOMAIN}" \
                -F https_enforced=true
              echo "https_enforced enabled"
              gh api "repos/${REPO}/pages"
              exit 0
            fi

            if [[ "${state}" == "errored" ]]; then
              echo "Certificate issuance errored; retrying domain save."
              gh api --method PUT "repos/${REPO}/pages" \
                -H "Accept: application/vnd.github+json" \
                -f cname="${DOMAIN}" \
                -F https_enforced=false || true
            fi

            sleep 20
          done

          echo "Certificate not issued within the wait window; domain is configured."
          gh api "repos/${REPO}/pages"
          exit 0
